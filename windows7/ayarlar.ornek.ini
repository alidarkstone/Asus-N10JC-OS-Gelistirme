; N10JC Windows 7 kiti ayarları. Değiştirmek isterseniz bu dosyayı "ayarlar.ini" adıyla kopyalayıp onu düzenleyin.
; Boş bırakılan alanlar için HAZIRLA.cmd pencere açıp sorar.

; Kendi orijinal Windows 7 ürün anahtarınız (ör. bilgisayarın altındaki COA etiketi veya satın aldığınız lisans).
; Bu dosyaya yazarsanız sorulmaz. Anahtar yalnızca kendi bilgisayarınızda kalır, depoya gönderilmez.
URUN_ANAHTARI=

; ISO'daki sürüm (ör. Ultimate, Professional, Home Premium). Boşsa listeden seçersiniz.
; Anahtarınız hangi sürüme aitse onu seçin.
SURUM=

KULLANICI=darkstone
; Boş şifre: açılışta doğrudan masaüstü gelir.
SIFRE=
BILGISAYAR_ADI=N10JC

; 1 = .NET Framework 4.8 de kurulsun (bazı oyun başlatıcıları ister, kurulumu ~20 dk uzatır)
NETFX48=0
