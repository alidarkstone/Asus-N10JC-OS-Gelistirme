# N10JC touchpad (Elantech/Synaptics PS/2): macOS-like behaviour
Section "InputClass"
    Identifier      "N10 touchpad"
    MatchIsTouchpad "on"
    Driver          "libinput"
    Option "Tapping"              "on"
    Option "TappingDrag"          "on"
    Option "NaturalScrolling"     "true"
    Option "ScrollMethod"         "twofinger"
    Option "ClickMethod"          "clickfinger"
    Option "DisableWhileTyping"   "true"
    Option "AccelSpeed"           "0.3"
EndSection
