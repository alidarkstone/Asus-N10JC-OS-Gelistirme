# N10 OS: memory tuning for 1 GB RAM + zram (see research/03-performans.md)
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.vfs_cache_pressure = 50
# Small writeback batches so SSD writes never freeze the UI
vm.dirty_bytes = 33554432
vm.dirty_background_bytes = 8388608
