name: Build N10 OS ISO
on:
  workflow_dispatch:
    inputs:
      kernel_series:
        description: Kernel series
        default: "6.18"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_SERIES: ${{ inputs.kernel_series || '6.18' }}

jobs:
  # The kernel takes most of the time, so it is its own job and cached by config.
  # A failing ISO step can then be re-run without rebuilding the kernel.
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: build/debs
          key: kernel-${{ env.KERNEL_SERIES }}-${{ hashFiles('kernel/**') }}
      - name: Build kernel inside Debian bookworm
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e KERNEL_SERIES -e KERNEL_ONLY=1 \
            debian:bookworm ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: n10os-kernel
          path: build/debs/
          retention-days: 14

  iso:
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: n10os-kernel
          path: build/debs/
      - name: Build ISO inside Debian bookworm
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src -e KERNEL_SERIES -e SKIP_KERNEL=1 \
            debian:bookworm ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: n10os-iso
          path: |
            build/*.iso
            build/*.sha256
          retention-days: 14
