name: Build N10 OS ISO
on:
  workflow_dispatch:
    inputs:
      kernel_series:
        description: Kernel series
        default: "6.18"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "windows7/**", ".github/workflows/windows7-kit.yml"]

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_SERIES: ${{ inputs.kernel_series || '6.18' }}

jobs:
  # The kernel takes most of the time, so it is its own job and cached by config.
  # A failing ISO step can then be re-run without rebuilding the kernel.
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: build/debs
          key: kernel-${{ env.KERNEL_SERIES }}-${{ hashFiles('kernel/**') }}
      - name: Build kernel inside Debian bookworm
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e KERNEL_SERIES -e KERNEL_ONLY=1 \
            debian:bookworm ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: n10os-kernel
          path: build/debs/
          retention-days: 14

  iso:
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: n10os-kernel
          path: build/debs/
      - name: Build ISO inside Debian bookworm
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src -e KERNEL_SERIES -e SKIP_KERNEL=1 \
            debian:bookworm ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: n10os-iso
          path: |
            build/*.iso
            build/*.sha256
          retention-days: 14

  # Boot the ISO in QEMU and screenshot the desktop. Screenshots also go to the
  # ci-shots branch so they can be checked without downloading the ISO.
  smoke:
    needs: iso
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: n10os-iso
          path: build/
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 socat squashfs-tools imagemagick mtools
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - name: Boot and screenshot
        run: tests/qemu-smoke.sh build/*.iso smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n10os-smoke
          path: smoke/
          retention-days: 14
      - name: Publish screenshots to ci-shots branch
        if: always()
        run: |
          cp -r smoke /tmp/smoke
          git config user.name "n10os-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-shots && git rm -rqf . && rm -rf build smoke
          cp -r /tmp/smoke/* . && echo "${{ github.sha }}" > SOURCE_SHA
          git add -A && git commit -qm "Smoke test for ${{ github.sha }}" && git push -f origin ci-shots
